# Memory settings for the 4 GB VPS. Ubuntu's postgresql.conf reads every
# *.conf in this folder, so the main config stays untouched.
# Apply with: sudo systemctl restart postgresql

# Postgres's own cache. The whole database fits in it many times over.
shared_buffers = 512MB

# Planner hint for how much the OS can cache. Allocates nothing.
effective_cache_size = 2GB

# Memory per sort or hash step in a query.
work_mem = 8MB

# API pool (5) plus migrations, backups and psql sessions.
max_connections = 20
